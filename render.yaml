# Blueprint for the optional backend, not the GitHub Pages static site.
services:
  - type: web
    name: piston-deepseek-gateway
    runtime: node
    plan: free
    region: singapore
    branch: piston-ai-demo
    rootDir: server
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEMO_ACCESS_TOKEN
        generateValue: true
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: ALLOWED_ORIGINS
        value: https://ustbtobyma.github.io
      - key: MAX_OUTPUT_TOKENS
        value: "1800"
      - key: REQUESTS_PER_HOUR
        value: "60"
